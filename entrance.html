<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #fffefc 0%, #fffdf8 100%);
            font-family: "Courier New", Courier, monospace;
            color: #222;
        }

        .container {
            text-align: center;
        }

        h2 {
            font-weight: normal;
        }

        input {
            padding: 12px;
            font-size: 16px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            text-align: center;
            font-family: "Courier New", Courier, monospace;
            background: white;
            color: #222;
        }

        .error {
            color: #c44;
            margin-top: 10px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Password</h2>
        <input
            type="password"
            id="password"
            placeholder="Password"
            autofocus
        >
        <div class="error" id="error"></div>
    </div>

    <script>
        const input = document.getElementById("password");
        const error = document.getElementById("error");

        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                if (input.value.toLowerCase() === "tbgotptlmsm") {
                    window.location.href = "https://tbgotptlmsm.tomalovesmaya.com/";
                } else {
                    error.textContent = "Incorrect password.";
                    input.value = "";
                }
            }
        });
    </script>
</body>
</html>
